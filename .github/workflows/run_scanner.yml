name: Run Investor Engine

on:
  repository_dispatch:
    types:
      - telegram_trigger

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker (e.g. RELIANCE, TCS, INFY)"
        required: false
        default: "RELIANCE"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            requests \
            yfinance \
            google-genai

      - name: Determine Ticker
        id: ticker
        env:
          DISPATCH_TICKER: ${{ github.event.client_payload.ticker }}
          MANUAL_TICKER: ${{ inputs.ticker }}
        run: |
          if [ -n "$DISPATCH_TICKER" ]; then
            TICKER_INPUT="$DISPATCH_TICKER"
          else
            TICKER_INPUT="$MANUAL_TICKER"
          fi

          CLEANED_INPUT=$(echo "$TICKER_INPUT" | tr '[:lower:]' '[:upper:]' | xargs)

          if [ -z "$CLEANED_INPUT" ]; then
            CLEANED_INPUT="RELIANCE"
          fi

          echo "ticker=$CLEANED_INPUT" >> "$GITHUB_OUTPUT"
          echo "TICKER: $CLEANED_INPUT"

      - name: Run Investor Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TICKER="${{ steps.ticker.outputs.ticker }}"

          echo "Starting investor analysis for $TICKER..."

          python scanner.py "$TICKER"
