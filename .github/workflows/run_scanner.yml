name: Run Algorithmic Scanner

on:
  # This configuration line allows your Cloudflare Worker to trigger this workflow dynamically
  repository_dispatch:
    types: [telegram_trigger]
    
  # Keeps the manual run button active in your GitHub UI just in case
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Target Ticker Symbol (e.g. WIPRO)'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-python: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        pip install numpy pandas yfinance requests

    - name: Run Processing Engine
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        # Check if triggered via Cloudflare Webhook Dispatch vs Manual UI button Click
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          TICKER_INPUT="${{ github.event.client_payload.ticker }}"
        else
          TICKER_INPUT="${{ github.event.inputs.ticker }}"
        fi
        
        # Execute your core scanner script passing the parsed asset input parameter
        python scanner.py "$TICKER_INPUT"
