name: Daily Workday Job Scanner

on:
  schedule:
    # 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"

  # Allows you to manually run it from GitHub Actions
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # Restore previous SQLite database
      # ------------------------------------------------------

      - name: Restore jobs database
        uses: actions/download-artifact@v4
        with:
          name: workday-jobs-db
          path: .
        continue-on-error: true

      # ------------------------------------------------------
      # Run scanner
      # ------------------------------------------------------

      - name: Run Workday scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      # ------------------------------------------------------
      # Save updated database
      # ------------------------------------------------------

      - name: Upload jobs database
        uses: actions/upload-artifact@v4
        with:
          name: workday-jobs-db
          path: jobs.db
          retention-days: 90
          overwrite: true

      # ------------------------------------------------------
      # Save discovered Workday tenants
      # ------------------------------------------------------

      - name: Upload Workday tenant cache
        uses: actions/upload-artifact@v4
        with:
          name: workday-tenants
          path: tenants.json
          retention-days: 90
          overwrite: true
        if: always() && hashFiles('tenants.json') != ''
