name: Run Algorithmic Scanner

on:
  repository_dispatch:
    types: [telegram_trigger]

  workflow_dispatch:
    inputs:
      ticker:
        description: 'Target Ticker Symbol (e.g. WIPRO)'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository Code
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set Up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ==========================================
      # DEPENDENCIES
      # ==========================================

      - name: Install System Dependencies
  run: |
    pip install numpy pandas yfinance requests scipy curl_cffi google-genai


      # ==========================================
      # DETERMINE TICKER
      # ==========================================

      - name: Determine Ticker
        env:
          DISPATCH_TICKER: ${{ github.event.client_payload.ticker }}
          MANUAL_TICKER: ${{ github.event.inputs.ticker }}

        run: |

          if [ -n "$DISPATCH_TICKER" ]; then
            TICKER_INPUT="$DISPATCH_TICKER"
          else
            TICKER_INPUT="$MANUAL_TICKER"
          fi

          CLEANED_INPUT=$(echo "$TICKER_INPUT" | tr '[:lower:]' '[:upper:]' | xargs)

          if [ -z "$CLEANED_INPUT" ]; then
            echo "ERROR: No ticker supplied."
            exit 1
          fi

          echo "TICKER=$CLEANED_INPUT" >> "$GITHUB_ENV"

          echo "Target ticker: $CLEANED_INPUT"


      # ==========================================
      # RUN SCANNER + GEMINI
      # ==========================================

      - name: Run Processing Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |
          python scanner.py "$TICKER"